<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusOne - Admin Dashboard</title>
    <th:block th:replace="~{fragments/layout :: header-assets}"></th:block>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="app-content">
        <!-- Page Header (Screen 5) -->
        <div class="page-header">
            <h1 class="page-title">Admin Dashboard</h1>
            <p class="page-subtitle" th:text="'Welcome back, ' + ${username} + '!'">Welcome back, admin1!</p>
        </div>

        <!-- 3 Stat Cards (Screen 5) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Students</div>
                    <div class="stat-value" th:text="${totalStudentsCount}">85</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Faculty</div>
                    <div class="stat-value" th:text="${totalFacultyCount}">12</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path><path d="M9 9h1"></path><path d="M9 13h1"></path><path d="M9 17h1"></path></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Departments</div>
                    <div class="stat-value" th:text="${totalDepartmentsCount}">5</div>
                </div>
            </div>
        </div>

        <!-- Split Grid (Screen 5) -->
        <div class="dashboard-split-grid">
            <!-- Left Card: Quick Actions -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Quick Actions</h2>
                </div>
                <div class="quick-actions-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <a th:href="@{/admin/users(role='student')}" class="quick-action-btn green-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        </div>
                        <span>Add Student</span>
                    </a>
                    <a th:href="@{/admin/users(role='faculty')}" class="quick-action-btn blue-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        </div>
                        <span>Add Faculty</span>
                    </a>
                    <a th:href="@{/admin/users(role='hod')}" class="quick-action-btn orange-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        </div>
                        <span>Add HOD</span>
                    </a>
                    <a th:href="@{/admin/users(role='admin')}" class="quick-action-btn purple-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                        </div>
                        <span>Add Admin</span>
                    </a>
                </div>
            </div>

            <!-- Right Card: Recent Notices -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Recent Notices</h2>
                    <a th:href="@{/admin/notices}" class="card-action-link">View All</a>
                </div>
                <div class="announcement-list">
                    <div class="announcement-item" th:each="notice : ${recentNotices}">
                        <div class="announcement-item-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        </div>
                        <div class="announcement-item-content">
                            <h4 th:text="${notice.title}">College Annual Day</h4>
                            <span th:text="${notice.timeAgo}">1 day ago</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
