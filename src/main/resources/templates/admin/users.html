<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusOne - Manage Users</title>
    <th:block th:replace="~{fragments/layout :: header-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="app-content">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
            <h1 class="page-title" style="margin-bottom: 0;">Manage Users</h1>
            <button type="button" class="btn-primary" onclick="openAddUserModal()">+ Add New User</button>
        </div>

        <div th:if="${param.created}" class="alert-success">
            New user created successfully!
        </div>

        <div class="content-card">
            <div class="table-responsive">
                <table class="app-table">
                    <thead>
                        <tr><th>ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Department</th><th>Email</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.username}">student1</td>
                            <td th:text="${u.fullName}">student1</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${u.role.name() == 'STUDENT' ? 'badge-approved' : (u.role.name() == 'FACULTY' ? 'badge-pending' : 'badge-rejected')}"
                                      th:text="${u.role.name()}">
                                    STUDENT
                                </span>
                            </td>
                            <td th:text="${u.department}">Computer Science</td>
                            <td th:text="${u.email}">student1@campusone.edu</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal for Add User -->
<div id="addUserModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Add New User</h3>
            <button type="button" class="modal-close" onclick="closeAddUserModal()">&times;</button>
        </div>
        <form th:action="@{/admin/users}" method="post">
            <div class="form-group">
                <label class="form-label">Role</label>
                <select id="newUserRole" name="role" class="form-control" required>
                    <option value="STUDENT">Student</option>
                    <option value="FACULTY">Faculty</option>
                    <option value="HOD">Head of Department (HOD)</option>
                    <option value="ADMIN">Administrator</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. john2" required>
            </div>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullName" class="form-control" placeholder="e.g. Johnathan Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="e.g. john2@campusone.edu" required>
            </div>
            <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" value="Computer Science" required>
            </div>
            <div class="form-group">
                <label class="form-label">Initial Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" value="password123" required>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn-action-outline" onclick="closeAddUserModal()">Cancel</button>
                <button type="submit" class="btn-primary">Create User</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openAddUserModal() { document.getElementById('addUserModal').style.display = 'flex'; }
    function closeAddUserModal() { document.getElementById('addUserModal').style.display = 'none'; }
    
    // Check URL params to pre-select role if clicked from Quick Actions
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        if (role) {
            document.getElementById('newUserRole').value = role.toUpperCase();
            openAddUserModal();
        }
    });
</script>
</body>
</html>
