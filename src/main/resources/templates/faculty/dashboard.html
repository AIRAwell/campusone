<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusOne - Faculty Dashboard</title>
    <th:block th:replace="~{fragments/layout :: header-assets}"></th:block>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="app-content">
        <!-- Page Header (Screen 3) -->
        <div class="page-header">
            <h1 class="page-title">Faculty Dashboard</h1>
            <p class="page-subtitle" th:text="'Welcome back, ' + ${username} + '!'">Welcome back, faculty1!</p>
        </div>

        <!-- 3 Stat Cards (Screen 3) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">My Classes</div>
                    <div class="stat-value" th:text="${myClassesCount}">4</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Pending Assignments</div>
                    <div class="stat-value" th:text="${pendingAssignmentsCount}">5</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">New Requests</div>
                    <div class="stat-value" th:text="${newRequestsCount}">2</div>
                </div>
            </div>
        </div>

        <!-- Split Grid (Screen 3) -->
        <div class="dashboard-split-grid">
            <!-- Left Card: Quick Actions -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Quick Actions</h2>
                </div>
                <div class="quick-actions-grid">
                    <a th:href="@{/faculty/mark-attendance}" class="quick-action-btn green-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                        </div>
                        <span>Mark Attendance</span>
                    </a>
                    <a th:href="@{/faculty/upload-notes}" class="quick-action-btn blue-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        </div>
                        <span>Upload Notes</span>
                    </a>
                    <a th:href="@{/faculty/enter-marks}" class="quick-action-btn orange-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </div>
                        <span>Enter Marks</span>
                    </a>
                    <a th:href="@{/faculty/announcements}" class="quick-action-btn purple-action">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </div>
                        <span>Post Announcement</span>
                    </a>
                </div>
            </div>

            <!-- Right Card: Recent Announcements -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Recent Announcements</h2>
                    <a th:href="@{/faculty/announcements}" class="card-action-link">View All</a>
                </div>
                <div class="announcement-list">
                    <div class="announcement-item" th:each="item : ${recentAnnouncements}">
                        <div class="announcement-item-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        </div>
                        <div class="announcement-item-content">
                            <h4 th:text="${item.title}">Lab session cancelled tomorrow</h4>
                            <span th:text="${item.timeAgo}">1 hour ago</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
