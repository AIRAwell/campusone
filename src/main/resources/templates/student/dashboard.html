<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusOne - Student Dashboard</title>
    <th:block th:replace="~{fragments/layout :: header-assets}"></th:block>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="app-content">
        <!-- Page Header (Screen 2) -->
        <div class="page-header">
            <h1 class="page-title">Student Dashboard</h1>
            <p class="page-subtitle" th:text="'Welcome back, ' + ${username} + '!'">Welcome back, student1!</p>
        </div>

        <!-- 4 Stat Cards (Screen 2) -->
        <div class="stats-grid">
            <!-- Today's Classes -->
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Today's Classes</div>
                    <div class="stat-value" th:text="${todayClassesCount}">3</div>
                </div>
            </div>

            <!-- Attendance -->
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Attendance</div>
                    <div class="stat-value green-text" th:text="${attendancePercentage}">85%</div>
                </div>
            </div>

            <!-- Pending Assignments -->
            <div class="stat-card">
                <div class="stat-icon orange">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Pending Assignments</div>
                    <div class="stat-value" th:text="${pendingAssignmentsCount}">2</div>
                </div>
            </div>

            <!-- New Notices -->
            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">New Notices</div>
                    <div class="stat-value" th:text="${newNoticesCount}">3</div>
                </div>
            </div>
        </div>

        <!-- Split Grid (Screen 2) -->
        <div class="dashboard-split-grid">
            <!-- Left Card: Today's Timetable -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Today's Timetable</h2>
                </div>
                <div class="table-responsive">
                    <table class="app-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Subject</th>
                                <th>Room</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${todayTimetable}">
                                <td th:text="${entry.timeRange}">09:00 - 10:00</td>
                                <td th:text="${entry.subject}">Data Structures</td>
                                <td th:text="${entry.room}">C101</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Card: Recent Announcements -->
            <div class="content-card">
                <div class="card-header-row">
                    <h2 class="card-title">Recent Announcements</h2>
                    <a th:href="@{/student/announcements}" class="card-action-link">View All</a>
                </div>
                <div class="announcement-list">
                    <div class="announcement-item" th:each="item : ${recentAnnouncements}">
                        <div class="announcement-item-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        </div>
                        <div class="announcement-item-content">
                            <h4 th:text="${item.title}">College will remain closed on Friday</h4>
                            <span th:text="${item.timeAgo}">2 hours ago</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
