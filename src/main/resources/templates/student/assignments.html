<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CampusOne - Assignments</title>
    <th:block th:replace="~{fragments/layout :: header-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="app-container">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <main class="app-content">
        <div class="page-header">
            <h1 class="page-title">Assignments</h1>
            <p class="page-subtitle">View active assignments, due dates, and submission status</p>
        </div>
        <div class="content-card">
            <div class="table-responsive">
                <table class="app-table">
                    <thead>
                        <tr><th>Title</th><th>Subject</th><th>Faculty</th><th>Due Date</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${assignments}">
                            <td th:text="${a.title}">Assignment 1</td>
                            <td th:text="${a.subject}">Data Structures</td>
                            <td th:text="${a.facultyName}">Dr. Smith</td>
                            <td th:text="${a.dueDate}">2025-06-18</td>
                            <td>
                                <span th:if="${a.status == 'Pending'}" class="badge badge-pending">Pending</span>
                                <span th:if="${a.status == 'Submitted'}" class="badge badge-approved">Submitted</span>
                            </td>
                            <td><button class="btn-action-outline">Submit / View</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
